<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17382f">
<title>إنجاز</title>
<style>
:root{color-scheme:light;--bg:#f2f4ee;--card:#fff;--tx:#14302a;--mut:#5f7169;--ac:#0f5c4a;--acx:#fff;--line:#dbe2d8;--fl:#e8890c;--bad:#b3402f;--hl:#e3f1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1a2b;--card:#16263c;--tx:#e8eef5;--mut:#93a4b8;--ac:#4fc3a1;--acx:#08201a;--line:#27384f;--fl:#ffb02e;--bad:#ef7a68;--hl:#1b3a45}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1a2b;--card:#16263c;--tx:#e8eef5;--mut:#93a4b8;--ac:#4fc3a1;--acx:#08201a;--line:#27384f;--fl:#ffb02e;--bad:#ef7a68;--hl:#1b3a45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.6 Tajawal,Tahoma,sans-serif;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.fl{width:36px;height:40px;display:inline-block;flex:none;--sp:1}.fl svg{width:100%;height:100%;overflow:visible}
.fl.off{filter:grayscale(1);opacity:.35}.fl.off *{animation:none!important}
.flm{filter:drop-shadow(0 0 7px var(--fl))}.f1,.f2,.f3{transform-box:fill-box;transform-origin:50% 100%}
.f1{animation:fa calc(1.3s*var(--sp)) ease-in-out infinite alternate}.f2{animation:fb calc(.9s*var(--sp)) ease-in-out infinite alternate}.f3{animation:fc calc(.6s*var(--sp)) ease-in-out infinite alternate}
.sk{fill:#ffd36b;opacity:0;animation:sk calc(2s*var(--sp)) linear infinite}.sk2{animation-delay:.7s}.sk3{animation-delay:1.3s}
@keyframes fa{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.95,1.07) rotate(1.5deg)}100%{transform:scale(1.04,.96) rotate(2.5deg)}}
@keyframes fb{0%{transform:scale(1,1.04) rotate(2deg)}100%{transform:scale(.94,.94) rotate(-3deg)}}
@keyframes fc{0%{transform:scale(1,1)}100%{transform:scale(.9,1.12) rotate(2deg)}}
@keyframes sk{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-34px)}}
@keyframes gl{0%,100%{box-shadow:0 0 3px 1px var(--bad)}50%{box-shadow:0 0 10px 4px var(--bad)}}
.it.cur{background:var(--hl);border-radius:10px}
.led{width:11px;height:11px;border-radius:50%;background:var(--bad);flex:none;animation:gl 1.2s ease-in-out infinite}.it.red{background:linear-gradient(270deg,rgba(220,60,40,.14),transparent)}
@media (prefers-reduced-motion:reduce){.f1,.f2,.f3,.sk,.led{animation:none}}
header h1{margin:0;font-size:20px;font-weight:800;flex:1}header small{color:var(--mut);display:block;font-weight:500;font-size:13px}
main{padding:12px 14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card.now{border:2px solid var(--ac);background:var(--hl)}
h2{font-size:17px;margin:0 0 8px;font-weight:800}h3{font-size:15px;margin:0;font-weight:700}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}.mut{color:var(--mut);font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:6px 12px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
button.g{border:0;background:none;color:var(--mut);padding:4px 8px}
.it{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--ac);padding:0;flex:none;font-size:15px;line-height:1;background:none;color:var(--acx)}
.ck.on{background:var(--ac)}.done{text-decoration:line-through;color:var(--mut)}
.tag{font-size:11px;background:var(--hl);color:var(--ac);border-radius:6px;padding:0 6px;font-weight:700}
.pt{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:12px}
.pt b{display:block;font-size:13px;font-weight:700}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:10.5px;padding:7px 0 5px;color:var(--mut);line-height:1.3}
nav button span{display:block;font-size:19px}nav button.on{color:var(--ac);font-weight:800}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
#md>div{background:var(--card);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.days{display:flex;gap:4px}.days button{flex:1;padding:6px 0;font-size:12px}.days button.on{background:var(--ac);color:var(--acx)}
.q{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q .card{margin:0;padding:10px;min-height:120px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:9px;color:var(--mut)}
.bc i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;opacity:.55}.bc.best i{opacity:1;background:var(--fl)}
#ts{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));inset-inline:12px;z-index:30;background:var(--ac);color:var(--acx);padding:10px 14px;border-radius:12px;font-weight:700;display:none}
.seg{display:flex;gap:3px;margin-top:8px}.seg i{flex:1;height:10px;border-radius:4px;background:var(--line)}.seg i.bad{background:var(--bad);box-shadow:0 0 6px var(--bad)}.seg i.on{background:var(--fl);box-shadow:0 0 6px var(--fl)}
select{background:var(--hl)}
.dd{position:relative;flex:1;min-width:0}
.ddb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;background:var(--hl);border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--tx);font-weight:700}
.ddb::after{content:"▾";color:var(--ac)}
.ddl{display:none;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;max-height:230px;overflow:auto;box-shadow:0 8px 22px rgba(0,0,0,.2)}
.dd.open .ddl{display:block}.dd.open .ddb{border-color:var(--ac)}
.ddl div{padding:10px 12px;border-radius:12px;cursor:pointer}.ddl div+div{margin-top:2px}.ddl div.on{background:var(--ac);color:var(--acx);font-weight:700}
#fp{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center}
#fp .bg{position:absolute;inset:0;background:rgba(8,14,24,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .5s}
#fp.on .bg{opacity:1}
#fp .bx{position:relative;display:flex;flex-direction:column;align-items:center}
#fp .fl{width:min(64vw,270px);height:min(72vw,304px);--sp:.28;transform:scale(.15);opacity:0;transition:transform .8s cubic-bezier(.2,1.5,.4,1),opacity .4s}
#fp.on .fl{transform:scale(1);opacity:1}
#fp .fl.fly{transition:transform .95s cubic-bezier(.55,0,.3,1),opacity .3s .7s}
#fp .cnt{margin-top:4px;text-align:center;color:#fff;transform:scale(0);opacity:0;transition:opacity .3s}
#fp .cnt.pop{animation:pp .65s cubic-bezier(.2,1.7,.4,1) forwards}
#fp .cnt b{display:block;font-size:72px;line-height:1.05;font-weight:800;text-shadow:0 0 22px var(--fl),0 0 4px #000}
#fp .cnt span{font-weight:700;font-size:18px}
@keyframes pp{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes hit{50%{transform:scale(1.4)}}
.empty{color:var(--mut);text-align:center;padding:14px;font-size:14px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3d00"/><stop offset="1" stop-color="#ff9800"/></linearGradient><linearGradient id="gM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9800"/><stop offset="1" stop-color="#ffc107"/></linearGradient><linearGradient id="gI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#fffde7"/></linearGradient></defs></svg>
<header><span class="fl" id="hf"></span><h1>إنجاز<small id="hd"></small></h1><span id="hc" class="mut"></span></header>
<div id="ts"></div>
<main id="m"></main>
<nav id="nv"></nav>
<div id="md"><div id="mb"></div></div>
<div id="fp"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const ALL=[0,1,2,3,4,5,6],DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const PN=['الفجر','الشروق','الظهر','العصر','المغرب','العشاء'];
const BN=['الفجر ← الشروق','الضحى','الظهر ← العصر','العصر ← المغرب','المغرب ← العشاء','بعد العشاء'];
const TY=[['w','عمل'],['q','قرآن'],['l','محاضرات'],['u','جامعة'],['b','قراءة كتاب']],TL={w:'عمل',q:'قرآن',l:'محاضرات',u:'جامعة',b:'قراءة كتاب'},WN={w:'العمل',q:'القرآن',l:'المحاضرات',u:'الجامعة',b:'قراءة الكتاب'};
const SUB=[['r','مراجعة'],['h','حفظ'],['t','تدبر'],['e','قراءة']],SL=Object.fromEntries(SUB),DS=['أح','اث','ثل','أر','خم','جم','سب'];
const tl=t=>TL[t]||esc(((S.ct.find(c=>'c'+c.id===t)||{}).n)||'عمل'),tag=i=>tl(i.ty)+(i.sub?' · '+SL[i.sub]:''),nm=i=>'وقت '+(WN[i.ty]||tl(i.ty))+(i.sub?' ('+SL[i.sub]+')':'');
function flame(){return '<svg class="flm" viewBox="0 0 100 108"><g class="f1"><path d="M50 4C58 24 82 38 82 66C82 88 68 100 50 100C32 100 18 88 18 66C18 50 28 42 34 30C38 38 42 40 44 40C44 28 46 14 50 4Z" fill="url(#gO)"/></g><g class="f2"><path d="M50 34C55 48 70 56 70 74C70 90 61 98 50 98C39 98 30 90 30 74C30 64 37 58 41 50C44 55 47 56 48 56C48 48 49 40 50 34Z" fill="url(#gM)"/></g><g class="f3"><path d="M50 62C54 70 62 74 62 84C62 93 56 98 50 98C44 98 38 93 38 84C38 76 46 72 50 62Z" fill="url(#gI)"/></g><circle class="sk" cx="38" cy="40" r="2.2"/><circle class="sk sk2" cx="62" cy="46" r="1.8"/><circle class="sk sk3" cx="50" cy="30" r="1.5"/></svg>'}
let S=null;try{S=JSON.parse(localStorage.getItem('injaz'))}catch(e){}
S=Object.assign({ct:[],plan:{},fixed:null,goals:[],gl:{},habits:[],hl:{},tasks:[],ev:[],al:[],sp:{},conf:null},S||{});
S.set=Object.assign({theme:'auto',target:80,cur:'ل.س',fa:18,ia:17,sens:2,warn:3},S.set||{});
if(!S.fixed)S.fixed=[];
const sv=()=>{try{localStorage.setItem('injaz',JSON.stringify(S))}catch(e){}};
/* ===== الوقت (توقيت سوريا UTC+3) ===== */
const sy=()=>new Date(Date.now()+108e5),kOf=d=>d.toISOString().slice(0,10),today=()=>kOf(sy());
const nowM=()=>{const d=sy();return d.getUTCHours()*60+d.getUTCMinutes()};
const addD=(k,n)=>{const d=new Date(k+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return kOf(d)},wd=k=>new Date(k+'T00:00:00Z').getUTCDay();
const fmt=m=>{m=Math.round(m);const h=Math.floor(m/60)%24,i=m%60;return (h%12||12)+':'+String(i).padStart(2,'0')+(h<12?' ص':' م')};
const R_=Math.PI/180,sin=a=>Math.sin(a*R_),cos=a=>Math.cos(a*R_),tan=a=>Math.tan(a*R_),asin=x=>Math.asin(x)/R_,acos=x=>Math.acos(Math.max(-1,Math.min(1,x)))/R_,at2=(y,x)=>Math.atan2(y,x)/R_,fx=(a,b)=>a-b*Math.floor(a/b);
function times(k){const[y,m,d]=k.split('-').map(Number),LAT=33.5138,LNG=36.2765,D=Date.UTC(y,m-1,d,9)/864e5+2440587.5-2451545;
const g=fx(357.529+.98560028*D,360),q=fx(280.459+.98564736*D,360),L=fx(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-3.6e-7*D;
const RA=fx(at2(cos(e)*sin(L),cos(L))/15,24),eq=fx(q/15-RA+12,24)-12,dc=asin(sin(e)*sin(L)),noon=15-LNG/15-eq;
const T=a=>acos((-sin(a)-sin(dc)*sin(LAT))/(cos(dc)*cos(LAT)))/15;
const A=acos((sin(at2(1,1+tan(Math.abs(LAT-dc))))-sin(dc)*sin(LAT))/(cos(dc)*cos(LAT)))/15;
return [noon-T(S.set.fa),noon-T(.833),noon+1/60,noon+A,noon+T(.833),noon+T(S.set.ia)].map(h=>Math.round(h*60))}
const blocks=k=>{const t=times(k),e=t.concat([1440]);return t.map((s,i)=>[s,e[i+1]])};
const curB=()=>{const n=nowM();return blocks(today()).findIndex(r=>n>=r[0]&&n<r[1])};
/* ===== البيانات ===== */
function ens(k){if(!S.plan[k]){const w=wd(k);S.plan[k]=S.fixed.filter(f=>f.d.includes(w)).map(f=>({id:uid(),t:f.t,b:f.b,ty:f.ty,sub:f.sub,g:f.g,done:false,fx:f.id}));sv()}return S.plan[k]}
{const OLD={r:'e',m:'r',d:'t'},mg=i=>{if(OLD[i.ty]){i.sub=OLD[i.ty];i.ty='q'}};
S.fixed=S.fixed.filter(f=>!(f.d.length===7&&['ورد القراءة','مراجعة المحفوظ','تدبر آيات'].includes(f.t)));
S.fixed.forEach(mg);S.goals.forEach(g=>{if(!g.q)g.q=2;if(!g.c)g.c=today()});Object.keys(S.plan).forEach(k=>{S.plan[k].forEach(mg);if(k>=today())S.plan[k]=S.plan[k].filter(i=>!i.fx||i.done||S.fixed.some(f=>f.id===i.fx))});sv()}
function roll(){const k=today(),cb=curB();if(cb<0||!S.plan[k])return 0;let n=0;S.plan[k].forEach(i=>{if(!i.done&&i.b>=0&&i.b<cb){i.b=cb;i.mv=1;n++}});if(n)sv();return n}
const HB=()=>S.habits.filter(h=>!h.fin);
const pct=k=>{const p=S.plan[k];if(!p)return null;const tot=p.length+HB().length;if(!tot)return null;return Math.round((p.filter(i=>i.done).length+HB().filter(h=>(S.hl[k]||{})[h.id]).length)*100/tot)};
const dayOk=k=>{const p=pct(k);return p!==null&&p>=S.set.target};
const gOk=(g,k)=>{if((S.gl[k]||{})[g.id])return true;const l=(S.plan[k]||[]).filter(i=>i.g===g.id);return l.length>0&&l.every(i=>i.done)};
function streak(fn){let k=today(),c=0;if(fn(k))c++;k=addD(k,-1);while(c<2000&&fn(k)){c++;k=addD(k,-1)}return c}
/* ===== واجهة ===== */
let tab='today',vd=today(),lastB=-2,mxv='t';
const TABS=[['today','🏠','اليوم'],['mx','🧭','أنواع الأعمال'],['hb','✅','العادات'],['gl','🎯','الأهداف'],['ag','📅','المواعيد'],['rp','📊','التقارير'],['st','⚙️','الإعدادات']];
function theme(){let t=S.set.theme;if(t==='auto'){const x=times(today()),n=nowM();t=(n<x[1]||n>=x[4])?'dark':'light'}document.documentElement.dataset.theme=t}
function toast(s){const e=$('#ts');e.textContent=s;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',6000)}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.4,.8].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start(c.currentTime+d);o.stop(c.currentTime+d+.25)})}catch(e){}}
function fire(s,snd){toast(s);if(snd)beep();try{if(window.Notification&&Notification.permission==='granted')new Notification('إنجاز',{body:s})}catch(e){}}
function chips(){return ''}
function bsel(v,n){return (n?`<option value="-1" ${v==null||v<0?'selected':''}>بدون وقت محدد</option>`:'')+blocks(vd).map((r,i)=>`<option value="${i}" ${i==v?'selected':''}>${BN[i]} (${fmt(r[0])})</option>`).join('')}
function R(){roll();theme();$('#nv').innerHTML=TABS.map(t=>`<button data-a="tab" data-x="${t[0]}" class="${tab===t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('');
const c=streak(dayOk);const hf=$('#hf');hf.className='fl'+(c?'':' off');if(!hf.firstChild)hf.innerHTML=flame();$('#hc').textContent=c?c+' يوم':'انطفأت';
$('#hd').textContent=DN[wd(vd)]+' '+vd;$('#m').innerHTML=V[tab]()}
const V={};
V.today=()=>{const k=vd,p=ens(k),t=times(k),bl=blocks(k),isT=k===today(),cb=isT?curB():-1,pc=pct(k)||0,late=isT&&1440-nowM()<=S.set.warn*60;
let h='';
const t0=today(),evs=(isT?S.ev.filter(e=>e.d>=t0&&e.d<=addD(t0,5)):S.ev.filter(e=>e.d===k)).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.m||0)-(b.m||0)),dl=e=>{const n=Math.round((new Date(e.d+'T00:00:00Z')-new Date(t0+'T00:00:00Z'))/864e5);return n===0?'اليوم':n===1?'غدًا':n===2?'بعد يومين':n>2?'بعد '+n+(n<=10?' أيام':' يومًا')+' ('+e.d+')':e.d};
if(evs.length)h+=`<div class="card" style="border-color:var(--fl)"><h3>⭐ مهم</h3>${evs.map(e=>`<div class="mut">${dl(e)}${e.m!=null?' '+fmt(e.m):''}: <b style="color:var(--tx)">${esc(e.t)}</b></div>`).join('')}</div>`;
if(cb>=0){const n=p.filter(i=>i.b===cb&&!i.done);h+=`<div class="card now"><h3>🕌 ${BN[cb]}</h3><div>${n.length?n.map(i=>nm(i)+': <b>'+esc(i.t)+'</b>').join('<br>'):'لا مهام معلّقة في هذه الفترة'}</div></div>`}
h+=`<div class="row" style="margin-bottom:8px"><button data-a="nav" data-x="-1">›</button><span class="sp" style="text-align:center">${isT?'اليوم':''}<button class="g" data-a="goto">${isT?'':'العودة لليوم'}</button></span><button data-a="nav" data-x="1">‹</button></div>`;
h+=`<div class="card"><div class="pt">${PN.map((n,i)=>`<div>${n}<b>${fmt(t[i])}</b></div>`).join('')}</div><div class="mut" style="text-align:center;margin-top:6px">بتوقيت سوريا (دمشق)</div></div>`;
